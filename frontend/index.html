<!doctype html>
<html lang="en" ng-app="app">
  <head>
    <meta charset="UTF-8" />
    <title>RediffMart</title>

    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
  </head>

  <body>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <div class="navbar" ng-controller="NavbarController">
      <div class="nav-left">
        <a href="#!/home" class="brand">
          <img
            src="/assets/images/logo.jpeg"
            alt="RediffMart"
            class="brand-logo"
          />
        </a>

        <ul class="nav-links" ng-if="loggedIn">
          <li>
            <a href="#!/home" ng-class="{ active: isActive('/home') }">Home</a>
          </li>
          <li>
            <a href="#!/products" ng-class="{ active: isActive('/products') }">Products</a>
          </li>
          <li ng-if="isCustomer()">
            <a href="#!/orders" ng-class="{ active: isActive('/orders') }">Orders</a>
          </li>
          <li ng-if="isAdmin()">
            <a href="#!/admin" ng-class="{ active: isActive('/admin') }">Admin</a>
          </li>
          <li ng-if="isSeller()">
            <a href="#!/seller" ng-class="{ active: isActive('/seller') }">Seller</a>
          </li>
        </ul>
      </div>

      <div class="nav-right">
        <div class="nav-search" ng-if="loggedIn">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            class="search-input"
            placeholder="Search products..."
          />
        </div>

        <span ng-if="loggedIn" class="nav-icons">
          <div class="profile-container" ng-if="isCustomer()">
            <button
              class="icon-btn"
              ng-class="{ active: profileMenuOpen }"
              ng-click="toggleProfileMenu($event)"
              title="Profile"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </button>

            <div class="dropdown-menu profile-dropdown" ng-show="profileMenuOpen">
              <div class="profile-info">
                <div class="profile-avatar">{{ currentUser.email.charAt(0).toUpperCase() }}</div>
                <div class="profile-text">
                  <p class="profile-email" title="{{ currentUser.email }}">{{ currentUser.email }}</p>
                  <span class="profile-role">{{ currentUser.role }}</span>
                </div>
              </div>
              <a href="#!/profile" class="dropdown-profile-btn" ng-click="closeProfileMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Account Settings
              </a>
              <button class="dropdown-logout-btn" ng-click="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
              </button>
            </div>
          </div>

          <a
            ng-if="isCustomer()"
            href="javascript:void(0)"
            class="icon-btn"
            title="Favourites"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path>
            </svg>
          </a>

          <a
            ng-if="isCustomer()"
            href="#!/cart"
            class="icon-btn"
            title="Cart"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
          </a>

          <a
            ng-if="!isCustomer()"
            title="Logout"
            href=""
            ng-click="logout()"
            class="icon-btn logout-btn"
          >
            <img
              src="/assets/images/logout.png"
              alt="Logout"
              class="logout-icon"
            />
          </a>
        </span>

        <span ng-if="!loggedIn" class="auth-links">
          <a href="#!/login">Login</a>
          <a href="#!/register">Register</a>
          <a href="#!/seller/login">Seller Login</a>
          <a href="#!/admin/login">Admin Login</a>
        </span>
      </div>
    </div>

    <div class="main-container">
      <ng-view></ng-view>
    </div>

    <script src="app/app.js"></script>
    <script src="app/services/auth.service.js"></script>
    <script src="app/services/category.service.js"></script>
    <script src="app/services/subCategory.service.js"></script>
    <script src="app/services/product.service.js"></script>
    <script src="app/services/cart.service.js"></script>
    <script src="app/services/order.service.js"></script>
    <script src="app/services/phone.service.js"></script>
    <script src="app/services/address.service.js"></script>
    <script src="app/services/phone.service.js"></script>
    <script src="app/services/admin.service.js"></script>
    <script src="app/services/seller.service.js"></script>

    <script src="app/controllers/auth.controller.js"></script>
    <script src="app/controllers/home.controller.js"></script>
    <script src="app/controllers/navbar.controller.js"></script>
    <script src="app/controllers/user.controller.js"></script>
    <script src="app/controllers/products.controller.js"></script>
    <script src="app/controllers/productDetail.controller.js"></script>
    <script src="app/controllers/cart.controller.js"></script>
    <script src="app/controllers/checkout.controller.js"></script>
    <script src="app/controllers/order.controller.js"></script>
    <script src="app/controllers/admin.controller.js"></script>
    <script src="app/controllers/seller.controller.js"></script>
  </body>
</html>
